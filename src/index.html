<!doctype html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Gamagement | مدیریت گیم‌سنتر</title>
    <link rel="icon" type="image/x-icon" href="/assets/icon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo-area">
          <!-- <span class="logo-icon">🎮</span> -->
          <h1>AsiaGame</h1>
        </div>
        <button
          class="btn-primary"
          data-action="showAddConsoleModal" data-args="[]"
          id="addConsoleBtn"
        >
          <span class="plus-icon">+</span> افزودن کنسول
        </button>
      </div>
    </header>

    <main class="container">
      <section id="consoles">
        <div class="section-header">
          <h2>مدیریت کنسول‌ها</h2>
          <div class="badge">سیستم فعال</div>
        </div>
        <div id="consoleList" class="grid"></div>
      </section>
    </main>

    <!-- Modals (Structures kept identical to preserve logic) -->
    <div id="consoleModal" class="modal">
      <div class="modal-content">
        <h3 id="consoleModalTitle">افزودن کنسول</h3>
        <div class="form-group">
          <label>نام کنسول</label>
          <input id="consoleName" placeholder="مثال: PS5 - VIP" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>قیمت ساعتی (تومان)</label>
            <input id="hourlyPrice" type="number" placeholder="مثال: 75000" />
          </div>
          <div class="form-group">
            <label>کنترلر اضافه (ساعتی)</label>
            <input
              id="controllerPrice"
              type="number"
              placeholder="مثال: 15000"
            />
          </div>
        </div>
        <input type="hidden" id="consoleEditId" />
        <div class="modal-buttons">
          <button class="btn-secondary" data-action="hideConsoleModal" data-args="[]">
            انصراف
          </button>
          <button
            class="btn-success"
            id="consoleSaveBtn"
            data-action="saveConsole" data-args="[]"
          >
            ذخیره
          </button>
        </div>
      </div>
    </div>

    <div id="sessionItemModal" class="modal">
      <div class="modal-content">
        <h3>افزودن خوراکی / کالا</h3>
        <div class="form-group">
          <label>نام آیتم</label>
          <input id="sessionItemName" placeholder="مثال: چیپس یا نوشابه" />
        </div>
        <div class="form-group">
          <label>قیمت (تومان)</label>
          <input id="sessionItemPrice" type="number" />
        </div>
        <input type="hidden" id="sessionIdForItem" />
        <div class="modal-buttons">
          <button class="btn-secondary" data-action="hideSessionItemModal" data-args="[]">
            انصراف
          </button>
          <button class="btn-success" data-action="saveSessionItem" data-args="[]">
            ثبت آیتم
          </button>
        </div>
      </div>
    </div>

    <div id="sessionItemEditModal" class="modal">
      <div class="modal-content">
        <h3>ویرایش آیتم</h3>
        <div class="form-group">
          <label>نام آیتم</label>
          <input id="sessionItemEditName" />
        </div>
        <div class="form-group">
          <label>قیمت (تومان)</label>
          <input id="sessionItemEditPrice" type="number" />
        </div>
        <input type="hidden" id="editItemSessionId" />
        <input type="hidden" id="editItemIndex" />
        <div class="modal-buttons">
          <button class="btn-secondary" data-action="hideSessionItemEditModal" data-args="[]">
            انصراف
          </button>
          <button class="btn-success" data-action="saveSessionItemEdit" data-args="[]">
            بروزرسانی آیتم
          </button>
        </div>
      </div>
    </div>

    <div id="endSessionModal" class="modal">
      <div class="modal-content end-modal">
        <div class="modal-header">
          <h3>فاکتور نهایی جلسه</h3>
        </div>
        <div class="invoice-details">
          <div class="invoice-item">
            <span>هزینه بازی:</span>
            <span id="gamePrice" class="val"></span>
          </div>
          <div class="invoice-item">
            <span>هزینه فروشگاه:</span>
            <span id="shopPrice" class="val"></span>
          </div>
          <div class="invoice-total">
            <span>مبلغ قابل پرداخت:</span>
            <span id="totalPrice" class="total-val"></span>
          </div>
        </div>
        <div class="modal-buttons">
          <button class="btn-danger full-width" data-action="confirmEndSession" data-args="[]">
            تسویه و بستن میز
          </button>
          <button
            class="btn-secondary full-width"
            data-action="hideEndSessionModal" data-args="[]"
          >
            بازگشت به بازی
          </button>
        </div>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
