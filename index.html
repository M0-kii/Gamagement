<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gamagement</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Gamagement</h1>
  </header>

    <div class="container">
        <section id="consoles">
            <h2>Consoles</h2>
            <button class="primary" onclick="showAddConsoleModal()">+ Add Console</button>
            <div id="consoleList" class="grid"></div>
        </section>

        <section id="shop">
            <h2>Shop Items</h2>
            <button class="primary" onclick="showAddItemModal()">+ Add Item</button>
            <div id="itemList" class="grid"></div>
        </section>
    </div>

    <!-- Console Modal -->
    <div id="consoleModal" class="modal">
      <div class="modal-content">
        <h3 id="consoleModalTitle">افزودن کنسول جدید</h3>

        <label for="consoleName">نام کنسول</label>
        <input id="consoleName" placeholder="مثال: PS5 - VIP">

        <label for="hourlyPrice">قیمت ساعتی (تومان)</label>
        <input id="hourlyPrice" type="number" placeholder="75000" step="1000">

        <label for="controllerPrice">قیمت کنترلر اضافی در ساعت (تومان)</label>
        <input id="controllerPrice" type="number" placeholder="15000" step="1000">

        <input type="hidden" id="consoleEditId">

        <div class="modal-buttons">
          <button class="warning" onclick="hideConsoleModal()">
            <i class="fa-solid fa-xmark"></i> انصراف
          </button>
          <button class="success" id="consoleSaveBtn" onclick="saveConsole()">
            <i class="fa-solid fa-floppy-disk"></i> ذخیره
          </button>
        </div>
      </div>
    </div>

    <!-- Item Modal -->
    <div id="itemModal" class="modal">
      <div class="modal-content">
        <h3 id="itemModalTitle">افزودن آیتم جدید</h3>

        <label for="itemName">نام آیتم</label>
        <input id="itemName" placeholder="مثال: نوشابه سرد">

        <label for="itemPrice">قیمت (تومان)</label>
        <input id="itemPrice" type="number" placeholder="25000" step="1000">

        <input type="hidden" id="itemEditId">

        <div class="modal-buttons">
          <button class="warning" onclick="hideItemModal()">
            <i class="fa-solid fa-xmark"></i> انصراف
          </button>
          <button class="success" id="itemSaveBtn" onclick="saveItem()">
            <i class="fa-solid fa-floppy-disk"></i> ذخیره
          </button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
