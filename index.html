<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gamagement</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Gamagement</h1>
    <button id="langBtn" onclick="switchLanguage()">FA</button>
  </header>

    <div class="container">
        <section id="consoles">
            <h2>Consoles</h2>
            <button class="primary" onclick="showAddConsoleModal()">+ Add Console</button>
            <div id="consoleList" class="grid"></div>
        </section>

        <section id="shop">
            <h2>Shop Items</h2>
            <button class="primary" onclick="showAddItemModal()">+ Add Item</button>
            <div id="itemList" class="grid"></div>
        </section>
    </div>

    <!-- Console Modal -->
    <div id="consoleModal" class="modal">
        <div class="modal-content">
            <h3 id="consoleModalTitle">Add New Console</h3>
            <input id="consoleName" placeholder="Console Name">
            <input id="hourlyPrice" type="number" placeholder="Hourly Price (€)" step="0.01">
            <input id="controllerPrice" type="number" placeholder="Controller Price (€)" step="0.01">
            <input type="hidden" id="consoleEditId">
            <div class="modal-buttons">
                <button class="secondary" onclick="hideConsoleModal()">Cancel</button>
                <button class="primary" id="consoleSaveBtn" onclick="saveConsole()">Add Console</button>
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h3 id="itemModalTitle">Add New Shop Item</h3>
            <input id="itemName" placeholder="Item Name">
            <input id="itemPrice" type="number" placeholder="Price (€)" step="0.01">
            <input type="hidden" id="itemEditId">
            <div class="modal-buttons">
                <button class="secondary" onclick="hideItemModal()">Cancel</button>
                <button class="primary" id="itemSaveBtn" onclick="saveItem()">Add Item</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
