<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gamagement</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Gamagement</h1>
    <button class="primary" onclick="showAddConsoleModal()" id="addConsoleBtn">+ Add Console</button>
  </header>
    <div class="container">
        <section id="consoles">
            <h2>Consoles</h2>
            <div id="consoleList" class="grid"></div>
        </section>
    </div>
    <!-- Console Modal -->
    <div id="consoleModal" class="modal">
      <div class="modal-content">
        <h3 id="consoleModalTitle">افزودن کنسول جدید</h3>
        <label for="consoleName">نام کنسول</label>
        <input id="consoleName" placeholder="مثال: PS5 - VIP">
        <label for="hourlyPrice">قیمت ساعتی (تومان)</label>
        <input id="hourlyPrice" type="number" placeholder="75000" step="1000">
        <label for="controllerPrice">قیمت کنترلر اضافی در ساعت (تومان)</label>
        <input id="controllerPrice" type="number" placeholder="15000" step="1000">
        <input type="hidden" id="consoleEditId">
        <div class="modal-buttons">
          <button class="warning" onclick="hideConsoleModal()">
            <i class="fa-solid fa-xmark"></i> انصراف
          </button>
          <button class="success" id="consoleSaveBtn" onclick="saveConsole()">
            <i class="fa-solid fa-floppy-disk"></i> ذخیره
          </button>
        </div>
      </div>
    </div>
    <!-- Session Item Modal -->
    <div id="sessionItemModal" class="modal">
      <div class="modal-content">
        <h3>افزودن آیتم</h3>
        <label for="sessionItemName">نام</label>
        <input id="sessionItemName" placeholder="مثال: چیپس">
        <label for="sessionItemPrice">قیمت (تومان)</label>
        <input id="sessionItemPrice" type="number" placeholder="25000" step="1000">
        <input type="hidden" id="sessionIdForItem">
        <div class="modal-buttons">
          <button class="warning" onclick="hideSessionItemModal()">انصراف</button>
          <button class="success" onclick="saveSessionItem()">ذخیره</button>
        </div>
      </div>
    </div>
    <!-- End Session Modal -->
    <div id="endSessionModal" class="modal">
      <div class="modal-content">
        <h3>جمع‌بندی جلسه</h3>
        <p>هزینه بازی: <span id="gamePrice"></span></p>
        <p>هزینه فروشگاه: <span id="shopPrice"></span></p>
        <p>جمع کل: <span id="totalPrice"></span></p>
        <button class="primary" onclick="hideEndSessionModal()">بستن</button>
      </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
